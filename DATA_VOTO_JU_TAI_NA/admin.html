<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - DataVotoCesf</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>Painel Administrativo</h1>
        <p>DataVotoCesf • Colégio Sagrada Família</p>
    </header>

    <!-- Tela de Login do Admin -->
    <section id="loginSection">
        <div class="login-card">
            <h2>Acesso Restrito</h2>
            <div class="form-group">
                <label for="senhaAdmin">Senha do Administrador:</label>
                <input type="password" id="senhaAdmin" placeholder="Digite a senha">
            </div>
            <button id="btnLogin">Entrar</button>
            <p id="erroLogin" class="error hidden">Senha incorreta. Tente novamente.</p>
        </div>
    </section>

    <!-- Conteúdo Analítico do Painel (SÓ EXIBIDO APÓS AUTENTICAÇÃO) -->
    <main id="adminContent" class="hidden">
        <section class="metrics-container">
            <div class="card">
                <h3>Total de Respostas</h3>
                <p id="totalRespostas">0</p>
            </div>
            <div class="card">
                <h3>Média de Moradores / Casa</h3>
                <p id="mediaMoradores">0.0</p>
            </div>
            <div class="card">
                <h3>Média de Trabalhadores / Casa</h3>
                <p id="mediaTrabalhadores">0.0</p>
            </div>
        </section>

        <section class="charts-container">
            <h2>Distribuição de Pautas Prioritárias</h2>
            <canvas id="graficoPautas"></canvas>
        </section>
    </main>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
